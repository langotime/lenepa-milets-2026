[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lenepa-milets-2026"
version = "0.1.0"
description = "Reproduction code and paper assets for the LeNEPA MiLeTS 2026 submission."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "datasets>=3.1.0",
  "ecg-augmentations",
  "h5py>=3.11",
  "hydra-core>=1.3.2",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "omegaconf>=2.3.0",
  "opencv-python",
  "pandas>=2.2,<3",
  "psutil>=7.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "torch>=2.7",
  "tqdm>=4.67",
  "wandb>=0.23",
  "wfdb>=4.3",
  "aiono",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["configs", "data", "losses", "models", "utils"]
include = ["pretrain.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
ecg-augmentations = { git = "https://github.com/klean2050/ecg-augmentations.git" }
aiono = { path = "../aionoscope/aionoscope", editable = true }

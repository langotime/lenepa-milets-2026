# @package _global_
defaults:
  - dataset: cauker2m
  - offline_probe_dataset: aiono_basic_components_balanced
  - model: vit_xs
  - objective: nepa_sigreg
  - _self_

# Runtime keys (REQUIRED - must be provided via CLI or overridden)
run_name: ???  # W&B run name (REQUIRED)

# Runtime keys (dump backend only)
data: null  # must stay null when data_backend!="dump"
offline_probe_data: null  # Optional mapping for offline probe dump datasets (e.g., PTB-XL).

# Runtime keys (optional)
out: pretrain              # Output directory (checkpoints saved to out/run_name/)
chkpt: null                # Path to checkpoint to resume from
amp: bfloat16              # Precision: float32 or bfloat16
compile: false             # Enable torch.compile
stop_after_steps: null     # Abort after this many training steps (relative to this run)
offline_probe_eval_only: false  # Evaluate offline eval at chkpt step then exit (requires chkpt)
seed: null                # Optional fixed seed (opt-in; default is non-deterministic)
seed_init: null            # Optional split seed (requires seed=null and all seed_* set)
seed_data: null            # Optional split seed (requires seed=null and all seed_* set)
seed_sigreg: null          # Optional split seed (requires seed=null and all seed_* set)
seed_offline_probe: null   # Optional split seed (requires seed=null and all seed_* set)
label_exposure_train_log_interval: null  # Optional: log label exposure on the training stream
label_exposure_offline_probe_log: false  # Optional: log exposure during offline probe optimization
batch_label_stats_train_log_interval: null  # Optional: log batch label-gap stats on the training stream
batch_label_stats_rare_bottom_k: null       # Required when batch_label_stats_* is enabled
ptbxl_train_sampling: uniform               # "uniform" or "weighted_rare"
ptbxl_train_sampling_alpha: null            # Required when ptbxl_train_sampling="weighted_rare".
ptb_xl_data_dir: null      # Path to raw PTB-XL directory (required when offline_probe_sources includes ptb-xl)

# UCR offline benchmark (runtime key; evaluated every offline_probe_eval_interval steps).
ucr:
  archive_root: ../data/ucr_archive_2018/UCRArchive_2018
  resize_mode: interp512  # "interp512" | "none"
  resize_target_length: 512
  eval_batch_size: 256
  classifier: rf  # "rf" | "logreg"
  rf_n_estimators: 200
  rf_n_jobs: -1
  dataset_names: null  # Optional list of dataset names; null = evaluate all.

# masking (unused by NEPA/LeNEPA, but required by configs.pretrain.Config)
patch_size: 8
min_block_size: 10
min_keep_ratio: 0.15
max_keep_ratio: 0.25
masking_strategy: remove
min_keep_ratio_global: 0.50
max_keep_ratio_global: 0.9

# model overrides
qkv_bias: True
bias: True

# training (step-based)
steps: 20_000
batch_size: 256
encoder_momentum: 0.998
final_encoder_momentum: 0.9995
learning_rate: 1.0e-4
final_learning_rate: 1.0e-4  # warmup + constant LR
learning_rate_warmup_steps: 1_000
weight_decay: 1.0e-2
final_weight_decay: 1.0e-1
opt_betas: [0.9, 0.99]
opt_eps: 1.0e-6
gradient_clip: 0
gradient_accumulation_steps: 1
checkpoint_interval: 1_000

# LeNEPA overrides (Plan 138)
use_mean_pooling: true
nepa_layer_output_norm: none
nepa_sigreg_scale_time: 20.0
nepa_sigreg_time_layers: [0, 8]

# online probe (disabled: CauKer2M is unlabeled)
probe_lr: null
probe_weight_decay: null
probe_eval_interval: null
probe_task: all

# offline eval schedule (UCR benchmark uses this cadence)
offline_probe_eval_interval: 1000
offline_probe_eval_at_step0: true

# offline probe (optional; only used when offline_probe_dataset/source(s) enabled)
offline_probe_task: null # must be null when offline_probe_sources does not include ptb-xl
offline_probe_steps: 5000
offline_probe_batch_size: 256
offline_probe_learning_rate: 1.0e-2
offline_probe_final_learning_rate: 1.0e-2
offline_probe_learning_rate_warmup_steps: 0
offline_probe_weight_decay: 0.0
offline_probe_opt_betas: [0.9, 0.999]
offline_probe_gradient_clip: 1.0
offline_probe_checkpoint_interval: 200
